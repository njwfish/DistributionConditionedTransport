# @package _global_.experiment
# Base GMM experiment with EmbeddingEncoder - generator must be specified separately

name: batchint_onehot_fm
description: "Batch integration"

# Override defaults - uses embedding encoder instead of GNN
defaults:
  - /dataset: batch_integration
  - /encoder: embedding
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /scheduler: cosine
  - /training: default1000
  - /loss: multimarginal

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 256
set_size: 512
batch_size: 256
lr: 2e-4