# @package _global_.experiment

# Split name (define before use)
split_name: "replicas-2"

# Experiment name and description
name: trellis_a2a
description: "Trellis a2a experiment"

defaults:
  - /dataset: trellis_a2a
  - /encoder: gnn
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /training: default10000
  - /loss: default
  - /sampling: default
  - /coupling: sinkhorn_01

# predictor parameters
predictor_loss_weight: 0.0
train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 256
hidden_dim: 256
set_size: 256
batch_size: 4
lr: 2e-4