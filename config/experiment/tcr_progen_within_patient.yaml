# @package _global_.experiment

# Experiment name and description
name: tcr_progen_within_patient
description: "TCR repertoire dataset with Progen2 generator - within patient transitions only"

# Override defaults from config.yaml
defaults:
  - /dataset: tcr
  - /encoder: esm
  - /generator: progen
  - /scheduler: cosine
  - /loss: default_source_only
  - /sampling: default
  - /training: default5000_mem
  - /coupling: edit_distance

# Predictor settings
train_predictor_posthoc: true

# Sampling parameters
num_samples: 50
selective_pairing_mode: null

# Model dimensions
latent_dim: 128
hidden_dim: 256

# Training/data sizing
batch_size: 1
set_size: 512
lr: 2e-5

# ESM encoder settings
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# Progen2 generator settings
progen2_model_name: 'hugohrban/progen2-small'
max_length_progen: 16 # TCR junction sequences are short

# Dataset behavior
within_patient: true  # Only consecutive timepoints within patients
split: train
test_fraction: 0.0
