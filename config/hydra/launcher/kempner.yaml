# @package hydra.launcher
# Kempner A100 partition launcher config
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# SLURM partition and account
partition: kempner
account: kempner_mzitnik_lab

# Resource allocation (A100 nodes: 4 GPUs, 64 cores, 1TB RAM)
cpus_per_task: 8
mem_gb: 64
timeout_min: 360  # 6 hours

# Submitit settings
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
array_parallelism: 16  # Max concurrent jobs
nodes: 1
tasks_per_node: 1
max_num_timeout: 3

# GRES specification
gres: gpu:nvidia_a100-sxm4-40gb:1

# Additional SLURM parameters
additional_parameters:
  mail-type: END,FAIL
  mail-user: ${oc.env:USER}@g.harvard.edu


