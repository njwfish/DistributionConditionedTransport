# @package _global_
# Sliced Wasserstein generator with UNet for images
defaults:
  - override /model: unet

generator:
  _target_: generator.direct.DirectGenerator
  model: ${model}
  loss_type: swd
  noise_dim: ${experiment.latent_dim}
  flatten_for_model: false
  loss_params:
    n_projections: 100
    p: 2

