# @package _global_.experiment

# Experiment name and description
name: lineage_semisupervised
description: "clonal dynamics with coupled distribution embeddings"


defaults:
  - /dataset: lineage_tracing_semi
  - /encoder: kernel_mean
  - /model: direct_mlp
  - /generator: mmd
  - /training: default1000
  - /loss: default
  - /predictor: default
  - /predictor_sampling: default
  - /predictor_training: none
  - /sampling: default

ot_coupling: false

# predictor parameters
use_predicted_latent: false
predictor_loss_weight: 0.001

train_predictor_posthoc: false

predictor_model_type: "mlp"
predictor_conditioning_mode: "concat"
predictor_condition_type: "none"
predictor_model_args:
  hidden_dim: 128
  num_layers: 2

# sampling parameters
weight_mode: "uniform"
num_samples: 10000
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: null

latent_dim: 128
hidden_dim: 512
set_size: 100

batch_size: 256
lr: 2e-4