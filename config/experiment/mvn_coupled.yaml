# @package _global_.experiment

# Experiment name and description
name: mvn_coupled_exp
description: "Multivariate normal distribution experiment with coupled distribution embeddings"

# Override defaults from config.yaml
defaults:
  - /dataset: mvn
  - /training: default5000
  - /loss: predictor
  - /predictor: default  # use unified predictor
  - /sampling: default



# predictor parameters
use_predicted_latent: false
predictor_loss_weight: 0

predictor_model_type: null
predictor_conditioning_mode: null
predictor_model_args: null

# sampling parameters
weight_mode: "uniform"
num_samples: null
unidirectional: false
exponential_weight_scale: 1.0

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 500
batch_size: 256
lr: 2e-4 