# @package _global_.experiment

# Split name (define before use)
split_name: "replicas-2"

# Experiment name and description
name: trellis_a2a_stratified
description: "Trellis a2a stratified experiment"

defaults:
  - /dataset: trellis
  - /encoder: gnn
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /training: default20000
  - /loss: predictor
  - /predictor: default_mse
  - /sampling: stratified_trellis
  #- /coupling: sinkhorn_01

# predictor parameters
predictor_loss_weight: 1.0
train_predictor_posthoc: false
predict_difference: true

predictor_model_type: "ridge"
predictor_model_args:
  ridge_alpha: 1e-3
  
# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 256
hidden_dim: 256
set_size: 256
batch_size: 4
lr: 2e-4