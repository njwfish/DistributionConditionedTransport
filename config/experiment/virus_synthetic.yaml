# @package _global_.experiment

# Experiment name and description
name: virus_synthetic
description: "synthetic dataset of virus evolution"

# Override defaults from config.yaml
defaults:
  - /dataset: synthetic_protein
  - /encoder: esm 
  - /generator: progen2
  - /scheduler: cosine
  - /training: default_virus
  - /loss: predictor
  - /predictor: default  # use unified predictor
  - /predictor_sampling: default
  - /predictor_training: default
  - /sampling: default


# TODO: change to the full data file once you are done with debugging
data_file: virus_tokenized_data_for_tde.pt

# Experiment-specific parameters
use_predicted_latent: true
predictor_loss_weight: 0

train_predictor_posthoc: true


predictor_model_type: "mlp"
predictor_conditioning_mode: "sinusoidal"
predictor_model_args:
  hidden_dim: 128
  num_layers: 2

# sampling parameters
weight_mode: "uniform"
num_samples: 50
exponential_weight_scale: 1.0
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 128 # TODO: make sure that this is really the correct latent_dim for the ESM2 8M model. Also make sure that there is no conflict due to double usage.
hidden_dim: 256 # TODO: is this really the correct hidden_dim for the ESM2 model??
# Training/data sizing (kept small to avoid OOM)
batch_size: 1
set_size: 16
lr: 2e-5

# ESM model settings
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# ProGen2 settings
progen2_model_name: 'hugohrban/progen2-base'
seq_length: 12
tokenize: false 
condition_dim: 32
freeze_progen2: false
gradient_accumulation_steps: 1
set_microbatch_size: 2
debug_memory_logging: false  # enable/disable GPU debug memory logger
condition_method: prefix
temperature: 1.0
use_esm_tokens: true # This is for decoding sequences when plotting examples for the snythetic protein task

