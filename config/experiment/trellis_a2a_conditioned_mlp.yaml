# @package _global_.experiment

# Split name (define before use)
split_name: "replicas-2"

# Experiment name and description
name: trellis_a2a_compressed
description: "Trellis A2A experiment with conditioning on cell type and treatment"

defaults:
  - /dataset: trellis_a2a_conditioned
  - /encoder: gnn_conditioned
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /training: default10000
  - /loss: predictor_conditioned
  - /predictor: conditioned
  - /sampling: stratified_trellis

ot_coupling: true

# predictor parameters
predictor_loss_weight: 1
train_predictor_posthoc: false

predictor_model_type: "ridge"
predictor_model_args:
  ridge_alpha: 1e-3

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 256
set_size: 32
batch_size: 4
lr: 2e-4
