# @package _global_.experiment

# Experiment name and description
name: pfam
description: "Pfam dataset"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam
  - /encoder: index_onehot
  - /generator: progen2
  - /training: short_mem
  - /loss: index_onehot
  - /sampling: default

train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Dataset parameters
max_length: 128
max_pfams: 1000
max_fam_size: 1000
tokenize: true
data_file: "pfam_tokenized_data_small.pt"
eval_data_file: "eval_pfam_tokenized_data_small.pt"
base_dir: "/orcd/data/omarabu/001/gokul/DistributionEmbeddings"

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 128
set_size: 32
batch_size: 4
lr: 2e-4
