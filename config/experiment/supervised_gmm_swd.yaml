# @package _global_.experiment
# Supervised GMM experiment with SWD generator

name: supervised_gmm_exp
description: "Supervised GMM with SWD generator - Y = X + shift"

defaults:
  - /dataset: supervised_gmm
  - /encoder: gnn
  - /generator: swd
  - /training: default
  - /scheduler: none
  - /loss: default_source_only

latent_dim: 16
hidden_dim: 64
set_size: 100
batch_size: 256
lr: 2e-4
