# @package _global_.experiment

# Experiment name and description
name: pfam
description: "Pfam dataset"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam_random
  - /encoder: esm
  - /generator: progen2
  - /training: default5000_mem
  - /loss: default
  - /sampling: default

train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Dataset parameters
max_length: 128
max_pfams: 900
data_file: "pfam_tokenized_data_${experiment.max_pfams}.pt"

# Experiment-specific parameters
latent_dim: 256
hidden_dim: 256
set_size: 32
batch_size: 4
lr: 2e-4
