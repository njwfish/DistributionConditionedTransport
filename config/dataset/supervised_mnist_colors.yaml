# @package _global_.dataset
_target_: datasets.mnist_colors.SupervisedMNISTColorsDataset
n_sets: 50000
set_size: ${experiment.set_size}
data_shape: [3, 28, 28]  # RGB channels, 28x28 MNIST images
digit_class: null  # Use all digits (0-9)
seed: ${seed}
data_root: './data'
train: true
# Restricted color support (smaller range than [0, 1])
color_min: 0.2
color_max: 0.8
# Simple color shift for supervision
color_shift: [0.1, 0.1, 0.1]
