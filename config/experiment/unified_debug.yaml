# @package _global_.experiment

# Experiment name and description
name: snapMMD_${dataset_name}_unified_exp
description: "SnapMMD ${dataset_name} experiment with unified dataset class"

# Override defaults from config.yaml
defaults:
  - /dataset: snapMMD_unified
  - /encoder: gnn
  - /model: diffusion_mlp
  - /generator: flow_matching  # Use flow matching for coupled embeddings
  - /training: default5000
  - /collate: shift_pairing  # Use random pairing for source/target
  - /loss: predictor
  - /predictor: mlp  # Use dt-conditioned MLP with sinusoidal encoding
  - /sampling: dt_equals_one

# Experiment-specific parameters
use_predicted_latent: true
predictor_loss_weight: 0

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 100
batch_size: 4
lr: 2e-4 