# @package _global_.experiment

# Split name (define before use)
split_name: "replicas-2"

# Experiment name and description
name: trellis_mfm_gnn_swd
description: "Trellis MFM swd experiment"

defaults:
  - /dataset: trellis
  - /encoder: gnn
  - /generator: swd_trellis_mfm
  - /training: default20000_early_stopping
  - /loss: default_source_only_trellis_mfm
  - /sampling: default
  #- /coupling: sinkhorn_01

# predictor parameters
predictor_loss_weight: 0.0
train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: "single_step"

# Experiment-specific parameters
latent_dim: 256
hidden_dim: 256
set_size: 256
batch_size: 4
lr: 2e-4