# @package _global_.experiment

# Experiment name and description
name: mnist_colors_exp
description: "MNIST colors experiment with convolutional GNN encoder, UNet model, and flow matching generator"

# Override defaults from config.yaml
defaults:
  - /dataset: mnist_colors
  - /encoder: conv_gnn
  - /model: unet
  - /generator: flow_matching_unet
  - /training: default
  - /sampling: none

# Experiment-specific parameters
latent_dim: 64
hidden_dim: 128
set_size: 100
batch_size: 32  # Smaller batch size for image data
lr: 1e-4

