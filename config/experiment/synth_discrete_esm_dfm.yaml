# @package _global_.experiment

# Experiment name and description
name: synth_discrete_esm_dfm
description: "Synthetic discrete k-mer dataset with ESM2 DFM generator"

# Override defaults from config.yaml
defaults:
  - /dataset: synth_discrete
  - /encoder: esm
  - /generator: dfm
  - /scheduler: cosine
  - /loss: default
  - /sampling: default
  - /training: default

# Predictor settings
use_predicted_latent: false
predictor_loss_weight: 0.0
train_predictor_posthoc: true

# Sampling parameters
num_samples: 50
exponential_weight_scale: 1.0
selective_pairing_mode: null

# Model dimensions
latent_dim: 128
hidden_dim: 256

# Training/data sizing
batch_size: 1
set_size: 8
lr: 2e-5

# ESM settings (encoder and generator)
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# Progen2 (for tokenization only)
progen2_model_name: 'hugohrban/progen2-small'

# Generator-specific settings
seq_length: 12
max_length: 16
condition_dim: 32
condition_method: "additive"
temperature: 1.0

# Tokenization
tokenize: false
