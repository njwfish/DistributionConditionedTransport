# @package _global_.experiment

# Experiment name and description
name: pfam_synthetic
description: "synthetic pfam dataset"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam_synthetic
  - /encoder: esm
  - /generator: progen2
  - /training: default_mem
  - /loss: default
  - /sampling: default

train_predictor_posthoc: true

# sampling parameters
num_samples: 1
selective_pairing_mode: null

# Dataset parameters
max_length: 128
tokenize: true
data_file: "synthetic_pfam_tokenized_data.pt"
eval_data_file: "eval_synthetic_pfam_tokenized_data.pt"

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 128
set_size: 8
batch_size: 8
lr: 2e-4
