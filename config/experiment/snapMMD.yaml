# @package _global_.experiment

# Experiment name and description
name: snapMMD_${dataset_name}
description: "SnapMMD ${dataset_name} experiment with unified dataset class"

# Override defaults from config.yaml
defaults:
  - /dataset: snapMMD_unified
  - /encoder: gnn
  - /model: diffusion_mlp
  - /generator: flow_matching  # Use flow matching for coupled embeddings
  - /training: default
  - /loss: default
  - /predictor: none
  - /sampling: default

ot_coupling: false

predictor_loss_weight: 0
train_predictor_posthoc: true

# sampling parameters
num_samples: null
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 32
batch_size: 4
lr: 2e-4