# @package _global_.experiment

# Experiment name and description
name: letters_coupled_exp
description: "Letters distribution experiment with coupled distribution embeddings"

# Override defaults from config.yaml
defaults:
  - /dataset: letters
  - /encoder: gnn
  - /model: noise_mlp
  - /generator: energy
  - /training: default5000
  - /sampling: default
  - /loss: default
  - /collate: random_pairing
  - /coupling: sinkhorn

train_predictor_posthoc: true

# sampling parameters
weight_mode: "uniform"
num_samples: 100   # number of pairs drawn from dataset each epoch
unidirectional: false
exponential_weight_scale: 1.0
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 500
batch_size: 64
lr: 2e-4 