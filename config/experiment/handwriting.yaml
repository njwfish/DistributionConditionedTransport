# @package _global_.experiment

# Experiment name and description
name: handwriting_exp
description: "Handwriting experiment with convolutional GNN encoder, UNet model, and flow matching generator"

# Override defaults from config.yaml
defaults:
  - /dataset: handwriting
  - /encoder: conv_gnn
  - /model: unet
  - /generator: flow_matching_unet
  - /training: default
  - /sampling: none

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 512
set_size: 64
batch_size: 24  # Smaller batch size for image data
lr: 1e-4

