# @package _global_.experiment

# Experiment name and description
name: snapMMD_energy_${dataset_name}
description: "SnapMMD ${dataset_name} experiment with energy-based generator"

# Override defaults from config.yaml
defaults:
  - /dataset: snapMMD_unified
  - /encoder: gnn
  - /model: noise_mlp
  - /generator: energy  # Use flow matching for coupled embeddings
  - /training: default5000
  - /loss: predictor
  - /predictor: default  # use unified predictor
  - /predictor_sampling: default
  - /predictor_training: default
  - /sampling: default

ot_coupling: false

# predictor parameters
use_predicted_latent: true
predictor_loss_weight: 0

train_predictor_posthoc: true


#predictor_model_type: "mlp"
#predictor_conditioning_mode: "sinusoidal"
#predictor_model_args:
#  hidden_dim: 128
#  num_layers: 2

predictor_model_type: "ridge"
predictor_conditioning_mode: "sinusoidal"
predictor_model_args:
  ridge_alpha: 1e-3

# sampling parameters
weight_mode: "uniform"
num_samples: null
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: "single_step"

# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 32
batch_size: 4
lr: 2e-4