# @package _global_.experiment

# Experiment name and description
name: snapMMD_energy_cotrain_ot_${dataset_name}
description: "SnapMMD ${dataset_name} experiment with unified dataset class"

# Override defaults from config.yaml
defaults:
  - /coupling: sinkhorn
  - /dataset: snapMMD_unified
  - /encoder: gnn
  - /model: noise_mlp
  - /generator: energy  # Use flow matching for coupled embeddings
  - /training: default
  - /loss: predictor
  - /predictor: default  # use unified predictor
  - /sampling: default

ot_coupling: true

# predictor parameters
use_predicted_latent: false
predictor_loss_weight: 1

train_predictor_posthoc: false

predictor_model_type: "ridge"
predictor_conditioning_mode: "concat"
predictor_condition_type: "scalar_d"
predictor_model_args:
  ridge_alpha: 1e-3

# sampling parameters
num_samples: null
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 32
hidden_dim: 64
set_size: 32
batch_size: 4
lr: 2e-4