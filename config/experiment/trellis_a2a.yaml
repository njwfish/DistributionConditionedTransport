# @package _global_.experiment

# Split name (define before use)
split_name: "replicas-2"

# Override defaults from config.yaml
defaults:
  - /dataset: trellis
  - /encoder: gnn
  - /model: noise_mlp
  - /generator: energy  # Use flow matching for coupled embeddings
  - /training: default
  - /loss: predictor
  - /predictor: default  # use unified predictor
  - /sampling: default

# predictor parameters
use_predicted_latent: false
predictor_loss_weight: 0

train_predictor_posthoc: true

predictor_model_type: "ridge"
predictor_conditioning_mode: "concat"
# TODO: need to condition on drug perturbation (and even cell type maybe)
predictor_condition_type: null
predictor_model_args:
  ridge_alpha: 1e-3

# sampling parameters
num_samples: null
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: null

# Experiment-specific parameters
latent_dim: 32
hidden_dim: 128
set_size: 16
batch_size: 4
lr: 2e-4