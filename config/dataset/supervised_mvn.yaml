# @package _global_.dataset
_target_: datasets.supervised_datasets.SupervisedMVNDataset
n_sets: 50000
set_size: ${experiment.set_size}
data_shape: [2]
seed: ${seed}
# Restricted mean support [0, 2.5] so that shifted target [1, 3.5] stays in [0, 5]
prior_mu: [0, 2.5]
prior_cov_df: 10
prior_cov_scale: 1
# Fixed shift transformation: Y = X + [1, 1]
shift: [1.0, 1.0]
