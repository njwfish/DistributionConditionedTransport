# @package _global_.dataset
_target_: datasets.pfams.SyntheticPfamDataset

# Data directory
data_dir: 'data/pfam'

# Tokenized data filename (from experiment config)
data_file: ${experiment.data_file}

# Set size for sampling (from experiment config)
set_size: ${experiment.set_size}

# Model names for tokenization
esm_name: 'facebook/esm2_t6_8M_UR50D'
progen_name: 'hugohrban/progen2-medium'

# Sequence settings
max_length: ${experiment.max_length}

# Reproducibility
seed: ${seed}

# Data loading settings
tokenize: false
