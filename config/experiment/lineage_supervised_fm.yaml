# @package _global_.experiment

# Experiment name and description
name: lineage_supervised
description: "clonal dynamics with coupled distribution embeddings"


defaults:
  - /dataset: lineage_tracing_supervised
  - /encoder: gnn
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /training: default1000
  - /loss: default_source_only
  - /sampling: default

ot_coupling: false

# sampling parameters
weight_mode: "uniform"
num_samples: 10000
exponential_weight_scale: 1.44  # approx ln(2)
selective_pairing_mode: null

latent_dim: 128
hidden_dim: 512
set_size: 100

batch_size: 256
lr: 2e-4