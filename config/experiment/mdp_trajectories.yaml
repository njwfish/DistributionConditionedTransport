# @package _global_.experiment

# Experiment name and description
name: mdp_trajectories_exp
description: "MDP trajectories experiment with discrete state-action sequences"

# Override defaults from config.yaml
defaults:
  - /dataset: mdp_trajectories
  - /encoder: gnn  # Use GNN encoder for now, can be adapted for sequences
  - /model: diffusion_mlp
  - /generator: flow_matching
  - /training: default
  - /sampling: none

# MDP-specific parameters
n_states: 10
n_actions: 10
trajectory_length: 20

# Experiment-specific parameters
latent_dim: 64
hidden_dim: 128
set_size: 100
batch_size: 64
lr: 1e-4

