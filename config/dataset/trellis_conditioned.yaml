# @package _global_.dataset
# Trellis dataset with conditioning information (cell_cond and treat_cond)
_target_: datasets.trellis.trellis_dataset

split_name: ${experiment.split_name}
set_size: ${experiment.set_size}
split_mode: "train"

ot_coupling: ${experiment.ot_coupling}

# Data shape is 43 (original features) - used by generator/model
# The encoder uses a separate in_dim of 45 (43 + 2 cell_cond)
data_shape: [43]
