# @package _global_

# TODO: can we take out predictor_training now that I removed the section at the end of main.py that was training the latent mapping model redundantly?
# Default configurations
defaults:
  - dataset: none  # Dataset-specific config
  - encoder: none  # Default encoder
  - model: none  # Default model for DDPM
  - generator: none  # Default generator
  - optimizer: adam  # Default optimizer
  - scheduler: none  # Default scheduler
  - training: default  # Default training config
  - predictor: none  # Default predictor
  - collate: none  # Default collate function
  - wandb: default  # Default W&B config
  - loss: default  # Default loss config
  - sampling: none  # Default sampling config
  - experiment: mvn  # Experiment-specific configurations (MUST come after components it overrides)
  - override hydra/launcher: slurm
  - _self_

# Basic experiment settings
experiment_name: ${experiment.name}  # Name will be defined in experiment config
dataset_name: GoM  # Default to GoM, can be: GoM, LV, PBMC, Repressilator
seed: 42
device: cuda

# Validation split parameters
validation_split: 0.1  # 20% for validation, 80% for training
shuffle_before_split: true  # Whether to shuffle data before splitting

# Hydra-related settings
hydra:
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: multirun/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    config:
      override_dirname:
        exclude_keys:
          - seed
          - device
          - hydra
          - experiment_name 
