# @package _global_.experiment

# Experiment name and description
name: virus_time_and_location
description: "full dataset of virus evolution"

# Override defaults from config.yaml
defaults:
  - /dataset: virus_time_and_location
  - /encoder: esm
  - /generator: esm_dfm
  - /scheduler: cosine
  - /loss: default
  - /predictor: default  
  - /sampling: default
  - /training: default

data_file: /orcd/archive/abugoot/001/Projects/paolo/CoupledDistributionEmbeddings/data/spikeprot0430/iclr5_filtered_aggregated_data_country_efficient.pt

train_predictor_posthoc: true

# Experiment-specific parameters
use_predicted_latent: false
predictor_loss_weight: 0.0

predictor_model_type: "mlp"
predictor_conditioning_mode: "concat"
predictor_condition_type: null
predictor_model_args:
  hidden_dim: 128
  num_layers: 2


num_samples: 50
exponential_weight_scale: 1.0
selective_pairing_mode: single_step

# Experiment-specific parameters
latent_dim: 128 # TODO: make sure that this is really the correct latent_dim for the ESM2 8M model. Also make sure that there is no conflict due to double usage.
hidden_dim: 256 # TODO: is this really the correct hidden_dim for the ESM2 model??
# Training/data sizing (kept small to avoid OOM)
batch_size: 1
set_size: 16
lr: 2e-5

progen2_model_name: 'hugohrban/progen2-base'
freeze_progen2: false

# ESM model settings
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

seq_length: 1000
tokenize: false 
condition_dim: 32
microbatch_set_size: 1

condition_method: "additive"
temperature: 1.0