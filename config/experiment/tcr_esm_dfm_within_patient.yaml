# @package _global_.experiment

# Experiment name and description
name: tcr_esm_dfm_within_patient
description: "TCR repertoire dataset with ESM2 DFM generator - within patient transitions only"

# Override defaults from config.yaml
defaults:
  - /dataset: tcr
  - /encoder: esm
  - /generator: esm_dfm
  - /scheduler: cosine
  - /loss: default_source_only
  - /predictor: default
  - /sampling: default
  - /training: default

# Predictor settings
use_predicted_latent: false
predictor_loss_weight: 0.1
train_predictor_posthoc: true

predictor_model_type: "mlp"
predictor_conditioning_mode: "concat"
predictor_condition_type: null
predictor_model_args:
  hidden_dim: 128
  num_layers: 2

# Sampling parameters
num_samples: 50
exponential_weight_scale: 1.0
selective_pairing_mode: null

# Model dimensions
latent_dim: 128
hidden_dim: 256

# Training/data sizing
batch_size: 1
set_size: 32
lr: 2e-5

# ESM settings (encoder and generator)
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# Generator-specific settings
seq_length: 30  # TCR junction sequences are short
max_length: 30
condition_dim: 32
condition_method: "additive"
temperature: 1.0

# Tokenization
tokenize: false

# Dataset behavior
within_patient: true  # Only consecutive timepoints within patients
split: train
test_fraction: 0.3
