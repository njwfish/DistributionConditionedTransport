# @package _global_.experiment
# Base GMM experiment - generator must be specified separately

name: gmm_exp
description: "Gaussian mixture model distribution experiment"

# Override defaults - NO generator or model specified here (set via command line)
defaults:
  - /dataset: gmm
  - /encoder: gnn
  - /training: default
  - /scheduler: none  # ConstantLR - keeps learning rate fixed

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 256
set_size: 1000
batch_size: 256
lr: 2e-4

