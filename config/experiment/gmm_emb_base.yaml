# @package _global_.experiment
# Base GMM experiment with EmbeddingEncoder - generator must be specified separately

name: gmm_emb_exp
description: "GMM experiment with EmbeddingEncoder (lookup table)"

# Override defaults - uses embedding encoder instead of GNN
defaults:
  - /dataset: gmm
  - /encoder: embedding
  - /loss: multimarginal  # Required for EmbeddingEncoder (uses indices)
  - /training: default
  - /scheduler: none  # ConstantLR - keeps learning rate fixed

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 256
set_size: 1000
batch_size: 256
lr: 2e-4



