# @package _global_.experiment

# Experiment name and description
name: snapMMD_PBMC_coupled_exp
description: "SnapMMD PBMC experiment with coupled distribution embeddings"

# TODO: usin diffusion/flow matching for now as a first iteration.
# Override defaults from config.yaml
defaults:
  - /dataset: snapMMD_PBMC
  - /encoder: gnn
  - /model: diffusion_mlp
  - /predictor: dt_mlp_sinusoidal  # Use dt-conditioned MLP with sinusoidal encoding
  - /generator: flow_matching  # Use flow matching for coupled embeddings
  - /training: default5000
  - /collate: shift_pairing  # Use random pairing for source/target
  - /loss: predictor
  - /sampling: unidirectional

# TODO: need to change these parameters for PBMC?
# Experiment-specific parameters
latent_dim: 16
hidden_dim: 64
set_size: 100
bidirectional: true
batch_size: 256
lr: 2e-4