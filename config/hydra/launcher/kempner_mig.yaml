# @package hydra.launcher
# Kempner MIG (Multi-Instance GPU) partition - multiple jobs per GPU!
# Use this when you want to shard many lightweight processes per GPU
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# SLURM partition and account
partition: kempner_requeue
account: kempner_mzitnik_lab

# Resource allocation - using 3g.20gb MIG slice (1/3 of A100)
gpus_per_node: 1
cpus_per_task: 4
mem_gb: 32
timeout_min: 720  # 12 hours

# Submitit settings
submitit_folder: ${hydra.sweep.dir}/.submitit/%j
array_parallelism: 64  # High parallelism - each job uses 1/3 GPU
nodes: 1
tasks_per_node: 1
max_num_timeout: 5

# GRES specification - MIG slice (20GB of A100)
gres: gpu:nvidia_a100_3g.20gb:1

# Additional SLURM parameters
additional_parameters:
  mail-type: END,FAIL
  mail-user: ${oc.env:USER}@g.harvard.edu

