# @package _global_.experiment

# Experiment name and description
name: tcr_dfm_within_patient
description: "TCR repertoire dataset with ESM2 DFM generator - within patient transitions only"

# Override defaults from config.yaml
defaults:
  - /dataset: tcr
  - /encoder: esm
  - /generator: dfm
  - /scheduler: cosine
  - /loss: default_source_only
  - /sampling: default
  - /training: default5000_50

# Predictor settings
train_predictor_posthoc: true

# Sampling parameters
num_samples: 50
selective_pairing_mode: null

# Model dimensions
latent_dim: 128
hidden_dim: 256

# Training/data sizing
batch_size: 1
set_size: 2048
lr: 2e-5

# ESM settings (encoder and generator)
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# Generator-specific settings

condition_dim: 32
temperature: 1.0

# Dataset behavior
within_patient: true  # Only consecutive timepoints within patients
split: train
test_fraction: 0.0
