# @package _global_.experiment

# Experiment name and description
name: pfam_onehot_clan
description: "Pfam dataset with Progen2 generator using index-based one-hot encoding"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam_clan
  - /encoder: index_onehot
  - /generator: progen2
  - /training: default_mem
  - /loss: index_onehot
  - /sampling: default

train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Dataset parameters
max_pfams: 200
data_file: "pfam_tokenized_data_clan.pt"

# Experiment-specific parameters
# latent_dim is used by the generator for conditioning; equals max_pfams for one-hot encoding
latent_dim: 200
set_size: 32
batch_size: 4
lr: 2e-4