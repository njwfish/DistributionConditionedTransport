# @package _global_.experiment

# Experiment name and description
name: pfam
description: "Pfam dataset"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam
  - /encoder: esm
  - /generator: progen2
  - /training: default_mem
  - /loss: default
  - /sampling: default

train_predictor_posthoc: true

# sampling parameters
num_samples: 100
selective_pairing_mode: null

# Dataset parameters
max_length: 128
max_pfams: 200
data_file: "pfam_tokenized_data_clan.pt"
eval_data_file: "pfam_tokenized_data_clan_eval.pt"

# Experiment-specific parameters
latent_dim: 128
hidden_dim: 128
set_size: 32
batch_size: 4
lr: 2e-4
