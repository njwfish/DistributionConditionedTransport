# @package _global_.experiment

# Experiment name and description
name: pfam_esm_dfm_1e2
description: "Pfam dataset with ESM2 DFM generator, 1e2 pfams"

# Override defaults from config.yaml
defaults:
  - /dataset: pfam
  - /encoder: esm
  - /generator: esm_dfm
  - /scheduler: cosine
  - /loss: default
  - /predictor: default
  - /sampling: default
  - /training: default2000

# Predictor settings
use_predicted_latent: false
predictor_loss_weight: 0.1
train_predictor_posthoc: true

predictor_model_type: "mlp"
predictor_conditioning_mode: "concat"
predictor_condition_type: null
predictor_model_args:
  hidden_dim: 128
  num_layers: 2

# Sampling parameters
num_samples: 50
exponential_weight_scale: 1.0
selective_pairing_mode: null

# Model dimensions
latent_dim: 128
hidden_dim: 256

# Training/data sizing
batch_size: 1
set_size: 16
lr: 2e-5

max_length: 64
max_pfams: 100
max_fam_length: 64
data_file: "pfam_tokenized_data_l64_full.pt"
eval_data_file: "eval_pfam_tokenized_data_l64_full.pt"
base_dir: "/orcd/data/omarabu/001/gokul/DistributionEmbeddings"

# ESM settings (encoder and generator)
esm_model_name: 'facebook/esm2_t6_8M_UR50D'
freeze_esm2: false

# Progen2 (for tokenization only)
progen2_model_name: 'hugohrban/progen2-small'

# Generator-specific settings
seq_length: 128
condition_dim: 32
condition_method: "additive"
temperature: 1.0

# Tokenization
tokenize: false
